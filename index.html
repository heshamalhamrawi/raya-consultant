ن برنامج وأكتر من شركة تمويل، وكل برنامج ليه مدة ومقدم مختلف. خليني أشوف أنسب واحد ليك بالظبط.`,src:`بروتوكولات التقسيط والتمويل`,to:`/guide/protocols`},{title:`احسبها بالشهر`,say:`تعالى نحسبها سوا بالقسط الشهري، عشان تشوف الرقم اللي هتدفعه كل شهر وتقرر وإنت فاهم كل حاجة.`,src:`حاسبة التقسيط`,to:`/calc`},{title:`حتى لو مش مؤمن عليه`,say:`ولو حضرتك مش مؤمن عليك، ليك برضه طريق: فيه برامج لسواقين التطبيقات وأصحاب الكارت الطبي.`,src:`بروتوكولات التقسيط › غير المؤمن عليهم`,to:`/guide/protocols`}]},{id:`trust`,g:`الثقة والضمان`,q:`خايف الجهاز يبوظ`,also:[`يبوظ`,`يعطل`,`مش واثق`,`جودة`,`ضمان`],replies:[{title:`ضمان وصيانة معروفة`,say:`الجهاز عليه ضمان رسمي، ولو حصل أي عطل فيه صيانة معتمدة، وأنا هقولك بالظبط تروح فين أو تكلم مين.`,src:`السياسات › صيانة راية والوكيل`,to:`/guide/policies`},{title:`عيب صناعة؟ حقك محفوظ`,say:`ولو ظهر عيب صناعة خلال 30 يوم، من حقك بتقرير فني من مركز الصيانة.`,src:`السياسات › الاستبدال والاسترجاع`,to:`/guide/policies`},{title:`وريه الميزة`,say:`وخليني أوريك ميزة [الميزة] في الجهاز ده، دي معمولة مخصوص عشان تحمي الجهاز وتطوّل عمره.`,src:`ذاكر الخصائص (FAB)`,to:`/fab`}]},{id:`compare`,g:`المنافسة والماركات`,q:`الموديل التاني نفس المواصفات وأرخص`,also:[`نفس المواصفات`,`الموديل التاني`,`ليه ده`,`ايه الفرق`],replies:[{title:`قارن قدامه`,say:`خليني أقارنهم قدامك على الشاشة. هتلاقي الفرق في [الميزة]، وده اللي هيفرق معاك في الاستخدام كل يوم.`,src:`قارن موديلين`,to:`/compare`},{title:`الأداء قبل السعر`,say:`السعر بيتدفع مرة واحدة، لكن الأداء والكهربا والعمر هتعيش معاه سنين. خلّينا نشوف الأنسب لاستخدامك إنت.`,src:`منهج GUEST › أخطاء المقارنة`,to:`/guide/guest`},{title:`ارجع للاحتياج`,say:`إنت قولتلي إن أهم حاجة عندك [الاحتياج]، والموديل ده هو اللي بيحققها أحسن.`,src:`دليلك للفروقات`,to:`/diff`}]},{id:`notavailable`,g:`الخدمة والتوصيل`,q:`الموديل/اللون اللي عايزه مش موجود`,also:[`مش موجود`,`خلصان`,`مش متاح`,`لون تاني`],replies:[{title:`من فرع تاني`,say:`ولا يهمك، أقدر أطلبهولك من فرع تاني وتستلمه من هنا أو يتوصلك.`,src:`إجراءات البيع › تسليم طلب من فرع تاني`,to:`/guide/sales-procedures`},{title:`بديل قريب`,say:`وفيه موديل قريب جداً منه في المواصفات، خليني أوريهولك ونقارنهم مع بعض.`,src:`قارن موديلين`,to:`/compare`},{title:`توصيل لحد البيت`,say:`ولو حابب، نوصله لحد باب البيت. بس محتاج منك العنوان بالتفصيل ورقم الواتساب.`,src:`التوصيل للضيف`,to:`/guide/delivery`}]},{id:`nomoney`,g:`السعر والفلوس`,q:`مش معايا الفلوس دلوقتي`,also:[`مش معايا`,`الفلوس مش كفاية`,`لما اقبض`,`اخر الشهر`,`مفيش فلوس`],replies:[{title:`القسط بيحل ده`,say:`ولا يهمك يا فندم، مش لازم المبلغ كله النهارده. خليني أحسبلك قسط شهري يناسبك، وتاخد الجهاز من النهارده وإنت مرتاح.`,src:`حاسبة التقسيط`,to:`/calc`},{title:`قولها باليوم`,say:`القسط ده لو قسمناه على الشهر هيطلع حوالي كذا جنيه في اليوم. خليني أوريك الرقم بالظبط على الحاسبة.`,src:`حاسبة التقسيط`,to:`/calc`},{title:`احجزله ميعاد`,say:`ولو حابب تستنى لحد ما تقبض، أكتبلك الموديل والسعر النهارده وأستناك، وكلمني قبل ما تيجي أتأكدلك إنه متاح.`,src:`منهج GUEST`,to:`/guide/guest`}]},{id:`discount`,g:`السعر والفلوس`,q:`عايز خصم / آخر سعر كام؟`,also:[`خصم`,`اخر سعر`,`نزلي`,`هتعملي كام`,`اخر كلام`,`تخفيض`],replies:[{title:`القيمة قبل الخصم`,say:`خليني الأول أتأكد إن ده الجهاز اللي يناسبك فعلاً، وأوريك هو بيقدملك إيه. لو هو الصح، هتلاقي إن السعر في مكانه.`,src:`منهج GUEST › التفاوض`,to:`/guide/guest`},{title:`التقسيط منطقة وسط`,say:`لو الرقم كبير مرة واحدة، نقسطه على شهور ونخلّي القسط مريح. كده الفرق بيتوزع ومش هتحس بيه.`,src:`حاسبة التقسيط`,to:`/calc`},{title:`لو فيه خصم رسمي`,say:`لو فيه عرض النهارده على الموديل ده هقولهولك على طول، ومقدرش أوعدك بخصم مش رسمي لأنه بيتطلب بموافقة.`,src:`إجراءات البيع › الخصم الاستثنائي`,to:`/guide/sales-procedures`}]},{id:`wait-sale`,g:`السعر والفلوس`,q:`هستنى العروض / الأسعار هتنزل`,also:[`هستنى العروض`,`الاسعار هتنزل`,`بلاك فرايدي`,`الموسم`,`الجمعة البيضا`,`العيد`],replies:[{title:`الاستخدام من النهارده`,say:`ممكن العرض ييجي وممكن لأ، لكن الجهاز اللي محتاجه هتستخدمه من النهارده. كل شهر بتستناه بتتعب فيه مع القديم.`,src:`منهج GUEST`,to:`/guide/guest`},{title:`حقك محفوظ`,say:`ولو اشتريت النهارده، عندك 14 يوم من حقك تغيّر رأيك والجهاز بحالته الأصلية. يعني القرار مش مقفول عليك.`,src:`السياسات › الاستبدال والاسترجاع`,to:`/guide/policies`},{title:`أكلمك أنا`,say:`أو أسجل رقمك، ولو نزل عرض على الموديل ده أنا أكلمك بنفسي. اتفقنا؟`,src:`منهج GUEST`,to:`/guide/guest`}]},{id:`gift`,g:`السعر والفلوس`,q:`طب ادّيني هدية مع الجهاز`,also:[`هديه`,`هدية مع الجهاز`,`ببلاش`,`زيادة`,`حاجة معاه`],replies:[{title:`العروض الرسمية`,say:`لو فيه هدية أو عرض رسمي على الموديل ده النهارده هقولهولك فوراً، ومقدرش أوعد بحاجة مش في العرض.`,src:`إجراءات البيع › الخصم الاستثنائي`,to:`/guide/sales-procedures`},{title:`حاجة تكمّل الجهاز`,say:`بس خليني أوريك حاجة صغيرة بتكمّل الجهاز وتحميه، ونحسبها كلها مع بعض بالقسط.`,src:`تعرض إيه مع إيه`,to:`/cross`},{title:`مكافآت العملاء`,say:`وكمان مع كل شراية بتكسب في برنامج مكافآت العملاء، خليني أوريك إزاي تسجل.`,src:`السياسات › برنامج مكافآت العملاء`,to:`/guide/policies`}]},{id:`cheaper-model`,g:`السعر والفلوس`,q:`عايز أرخص حاجة وخلاص`,also:[`ارخص حاجه`,`الارخص`,`اي حاجه رخيصه`,`على قد الايد`,`ميزانيتي قليلة`],replies:[{title:`الأرخص المناسب`,say:`حاضر، بس قولي هتستخدمه في إيه بالظبط؟ عشان أجيبلك أرخص حاجة تقضي غرضك فعلاً، مش أرخص حاجة وخلاص.`,src:`منهج GUEST › فهم العميل`,to:`/guide/guest`},{title:`التكلفة الحقيقية`,say:`الجهاز الأرخص أحياناً بيصرف كهربا أكتر كل شهر. خليني أوريك الفرق في الاستهلاك وإنت تقرر.`,src:`دليلك للفروقات`,to:`/diff`},{title:`قسط بدل الأقل`,say:`ولو الأحسن شوية فرقه مش كبير، ممكن نقسطه بقسط قريب من اللي في دماغك.`,src:`حاسبة التقسيط`,to:`/calc`}]},{id:`spouse`,g:`التردد والقرار`,q:`هسأل مراتي / جوزي الأول`,also:[`اسال مراتي`,`اسال جوزي`,`المدام`,`الحاجه`,`اشاور`,`هستشير`,`البيت`],replies:[{title:`كلمها دلوقتي`,say:`طبعاً قرار البيت مهم. تحب نكلمها فيديو دلوقتي وأوريها الجهاز؟ أو أبعتلك صورته ومواصفاته على الواتساب.`,src:`منهج GUEST`,to:`/guide/guest`},{title:`ابعتله ملخص`,say:`خليني أبعتلك ملخص في رسالة: الموديل، أهم 3 مميزات ليكم، والسعر أو القسط، عشان تعرضوه مع بعض.`,src:`قارن موديلين`,to:`/compare`},{title:`القرار آمن`,say:`ولو أخدته النهارده وماعجبهاش، عندكم 14 يوم تغيّروا رأيكم والجهاز بحالته الأصلية.`,src:`السياسات › الاستبدال والاسترجاع`,to:`/guide/policies`}]},{id:`lookaround`,g:`التردد والقرار`,q:`هلف على المحلات الأول وأرجعلك`,also:[`هلف`,`الف`,`هشوف بره`,`هشوف المحلات`,`هقارن`],replies:[{title:`قارن هنا`,say:`حقك تقارن. خليني أقارنلك هنا قدامك بالأرقام، وخد المقارنة معاك على الموبايل وإنت بتلف.`,src:`قارن موديلين`,to:`/compare`},{title:`اللي مش هتلاقيه`,say:`وإنت بتقارن، خد بالك من الضمان والصيانة وحق الاسترجاع، دول مش بيتكتبوا على الكارت بس بيفرقوا جداً بعد البيع.`,src:`السياسات › صيانة راية والوكيل`,to:`/guide/policies`},{title:`سيب رقمك`,say:`ولو حابب، سيبلي رقمك وأكلمك لو فيه أي عرض على الموديل ده.`,src:`منهج GUEST`,to:`/guide/guest`}]},{id:`not-today`,g:`التردد والقرار`,q:`لسه بدري، مش محتاجه دلوقتي`,also:[`مش محتاجه دلوقتي`,`لسه بدري`,`بعدين`,`بعد كام شهر`,`لما القديم يبوظ`],replies:[{title:`اسأل عن القديم`,say:`الجهاز القديم بيعمل إيه دلوقتي؟ لو بيصرف كهربا أو صوته عالي أو بيعطل، يبقى كل شهر بيكلفك.`,src:`منهج GUEST › فهم العميل`,to:`/guide/guest`},{title:`اشتري وإنت مرتاح`,say:`الأحسن تشتري وإنت مختار براحتك، مش لما القديم يبوظ فجأة وتضطر تاخد أي حاجة.`,src:`منهج GUEST`,to:`/guide/guest`},{title:`احجز فكرتك`,say:`خليني أبعتلك الموديل المناسب ليك على الواتساب، وأول ما تحب ترجعلي.`,src:`منهج GUEST`,to:`/guide/guest`}]},{id:`newmodel`,g:`التردد والقرار`,q:`هستنى الموديل الجديد`,also:[`الموديل الجديد`,`هينزل جديد`,`موديل السنه`,`الاصدار الجديد`,`قديم`],replies:[{title:`الفرق الحقيقي`,say:`الموديل الجديد غالباً بييجي بسعر أعلى، والفرق بيبقى في حاجات صغيرة. خلينا نشوف إيه اللي إنت محتاجه فعلاً.`,src:`دليلك للفروقات`,to:`/diff`},{title:`قارن بالأرقام`,say:`لو عندك موديل معين في دماغك، خليني أقارنهولك بالمتاح النهارده على الشاشة.`,src:`قارن موديلين`,to:`/compare`},{title:`متضيعش الاستخدام`,say:`الجهاز اللي قدامك ده هيقضي احتياجك من النهارده، والانتظار ممكن يطول.`,src:`منهج GUEST`,to:`/guide/guest`}]},{id:`expert`,g:`التردد والقرار`,q:`أنا فاهم في الأجهزة دي أكتر منك`,also:[`انا فاهم`,`عارف كل حاجه`,`قريت على النت`,`مش محتاج شرح`],replies:[{title:`احترم معرفته`,say:`أكيد يا فندم، وده بيسهّل علينا. قولي إنت بتدوّر على أنهي مواصفات بالظبط وأنا أطلّعلك اللي يطابقها.`,src:`منهج GUEST › Cautious`,to:`/guide/guest`},{title:`أرقام دقيقة`,say:`خليني أوريك المواصفات الحقيقية لكل موديل جنب بعض بنفس المسطرة، من غير كلام إعلانات.`,src:`قارن موديلين`,to:`/compare`},{title:`اللي مش على النت`,say:`وأنا أضيفلك اللي مش هتلاقيه على النت: الضمان والصيانة وحق الاسترجاع من راية.`,src:`السياسات › صيانة راية والوكيل`,to:`/guide/policies`}]},{id:`try-home`,g:`التردد والقرار`,q:`عايز أجربه في البيت الأول`,also:[`اجربه`,`تجربه`,`لو معجبنيش`,`على التجربه`],replies:[{title:`14 يوم`,say:`عندك 14 يوم لو غيّرت رأيك، بشرط الجهاز يفضل بحالته الأصلية في كرتونته ومتبرشم. فخليني أشرحلك كل حاجة هنا قبل ما تفتحه.`,src:`السياسات › الاستبدال والاسترجاع`,to:`/guide/policies`},{title:`جرّبه هنا`,say:`وخليني أشغلهولك هنا في المعرض لو متاح، وتشوف بعينك وتسمع صوته.`,src:`منهج GUEST › عرض المنتج`,to:`/guide/guest`},{title:`العيب ليه 30 يوم`,say:`ولو ظهر فيه عيب صناعة، ليك حق خلال 30 يوم بتقرير فني من الوكيل.`,src:`السياسات › الاستبدال والاسترجاع`,to:`/guide/policies`}]},{id:`docs`,g:`التقسيط`,q:`ورق التقسيط كتير ومتعب`,also:[`ورق كتير`,`مستندات`,`اثبات دخل`,`الورق`,`متعب`],replies:[{title:`الورق بسيط`,say:`الورق أبسط مما إنت فاكر: بطاقة سارية وإثبات دخل. خليني أقولك المطلوب بالظبط في حالتك.`,src:`بروتوكولات التقسيط › إثبات الدخل`,to:`/guide/protocols`},{title:`برنامج يناسبك`,say:`ولو مش موظف بتأمينات، فيه برامج لسواقين التطبيقات وأصحاب الكارت الطبي بورق مختلف.`,src:`بروتوكولات التقسيط`,to:`/guide/protocols`},{title:`نخلصها النهارده`,say:`لو الورق معاك، نقدّم دلوقتي ونخلصها في نفس اليوم إن شاء الله.`,src:`بروتوكولات التقسيط`,to:`/guide/protocols`}]},{id:`commit`,g:`التقسيط`,q:`مش عايز التزام شهري / الأقساط طويلة`,also:[`التزام`,`طويل`,`شهور كتير`,`مش عايز ديون`,`قسط طويل`],replies:[{title:`إنت اللي تختار المدة`,say:`المدة إنت اللي بتحددها: ممكن 6 شهور أو أقل أو أكتر، خليني أوريك القسط على كل مدة وتختار اللي مريحك.`,src:`حاسبة التقسيط`,to:`/calc`},{title:`مقدم أكبر`,say:`ولو عايز قسط أصغر، تقدر تدفع مقدم أكبر والقسط يقل.`,src:`حاسبة التقسيط`,to:`/calc`},{title:`كاش برضه متاح`,say:`ولو مش مرتاح للتقسيط خالص، الكاش موجود، وأنا أساعدك تختار في الميزانية اللي معاك.`,src:`منهج GUEST`,to:`/guide/guest`}]},{id:`nodown`,g:`التقسيط`,q:`مش عايز أدفع مقدم`,also:[`من غير مقدم`,`زيرو مقدم`,`بدون مقدم`,`مقدم كبير`],replies:[{title:`على حسب البرنامج`,say:`المقدم بيختلف من برنامج للتاني ومن شركة تمويل لأخرى. خليني أشوف أنسب برنامج لحالتك.`,src:`بروتوكولات التقسيط`,to:`/guide/protocols`},{title:`احسبها قدامه`,say:`نحسبها على الحاسبة بمقدم صفر وبمقدم بسيط، وإنت تشوف الفرق في القسط.`,src:`حاسبة التقسيط`,to:`/calc`},{title:`وضوح كامل`,say:`وهقولك كل الأرقام: المقدم، والقسط، والإجمالي، عشان تقرر وإنت فاهم.`,src:`حاسبة التقسيط`,to:`/calc`}]},{id:`rejected`,g:`التقسيط`,q:`اترفضت قبل كده في التقسيط`,also:[`اترفضت`,`رفضوني`,`مش هيوافقوا`,`الاستعلام`,`اي سكور`],replies:[{title:`برامج مختلفة`,say:`كل شركة تمويل وكل برنامج ليه شروطه، فالرفض في مكان مش معناه الرفض في كل مكان. خليني أشوف حالتك.`,src:`بروتوكولات التقسيط`,to:`/guide/protocols`},{title:`ضامن أو حد من البيت`,say:`وممكن نشوف الإجراءات باسم حد من البيت مستوفي الشروط لو ده يناسبكم.`,src:`بروتوكولات التقسيط`,to:`/guide/protocols`},{title:`وضوح بدل الوعود`,say:`مقدرش أوعدك بالموافقة، بس أقدر أقولك بالظبط الشروط والورق، والقرار بيطلع من الاستعلام.`,src:`بروتوكولات التقسيط › خطوط حمراء`,to:`/guide/protocols`}]},{id:`noinsurance`,g:`التقسيط`,q:`أنا مش موظف / مش متأمن عليا`,also:[`مش موظف`,`مش متامن`,`شغال حر`,`مش متأمن عليا`,`معنديش تأمينات`],replies:[{title:`سواقين التطبيقات`,say:`لو شغال على أوبر أو ديدي أو إن درايفر، عندنا برنامج مخصوص من 30 لـ 60 سنة بإثبات أرباح آخر 6 شهور.`,src:`بروتوكولات التقسيط › سواقين التطبيقات`,to:`/guide/protocols`},{title:`الكارت الطبي`,say:`ولو عندك كارت طبي من شركة تأمين بقاله 6 شهور على الأقل، فيه برنامج من 25 لـ 60 سنة.`,src:`بروتوكولات التقسيط › الكارت الطبي`,to:`/guide/protocols`},{title:`حد من البيت`,say:`ولو مفيش ده ولا ده، ممكن نشوفها باسم حد من البيت مستوفي الشروط.`,src:`بروتوكولات التقسيط`,to:`/guide/protocols`}]},{id:`badservice`,g:`الثقة والضمان`,q:`اتبهدلت قبل كده في الصيانة`,also:[`اتبهدلت`,`الصيانه وحشه`,`محدش رد`,`الصيانه بطيئه`,`مركز الصيانه`],replies:[{title:`اسمعه الأول`,say:`متفهم جداً، ودي تجربة مضايقة. احكيلي حصل إيه، عشان أعرف أطمّنك بالظبط.`,src:`الشكاوى › العميل الغاضب`,to:`/guide/complaints`},{title:`هتعرف تروح فين`,say:`الجهاز ده صيانته معروفة، وهكتبلك على الفاتورة تتابع فين: صيانة راية على 19900، أو التوكيل المعتمد للماركة.`,src:`السياسات › صيانة راية والوكيل`,to:`/guide/policies`},{title:`حقك في العيب`,say:`ولو ظهر عيب صناعة خلال 30 يوم، حقك ترجعه أو تستبدله بتقرير فني.`,src:`السياسات › الاستبدال والاسترجاع`,to:`/guide/policies`}]},{id:`warranty-short`,g:`الثقة والضمان`,q:`الضمان قصير`,also:[`الضمان قليل`,`ضمان سنه`,`ضمان قصير`,`بعد الضمان`],replies:[{title:`وضّح الضمان`,say:`خليني أقولك الضمان بالظبط على الموديل ده ومين اللي بيقدمه، وأكتبهولك.`,src:`السياسات › صيانة راية والوكيل`,to:`/guide/policies`},{title:`بعد الضمان برضه`,say:`وحتى بعد الضمان، الصيانة المعتمدة موجودة وقطع الغيار أصلية.`,src:`السياسات › صيانة راية والوكيل`,to:`/guide/policies`},{title:`ميزة بتحمي الجهاز`,say:`والموديل ده فيه ميزة بتحمي الجهاز وتطوّل عمره، خليني أوريهالك.`,src:`ذاكر الخصائص`,to:`/fab`}]},{id:`unknown-brand`,g:`الثقة والضمان`,q:`الماركة دي مش معروفة`,also:[`مش معروفه`,`ماركه صيني`,`مسمعتش عنها`,`براند مش مشهور`],replies:[{title:`الضمان واحد`,say:`الماركة دي متاحة في راية بضمان وصيانة معتمدة، يعني لو حصل أي حاجة إنت عارف تروح فين.`,src:`السياسات › صيانة راية والوكيل`,to:`/guide/policies`},{title:`المواصفات تتكلم`,say:`خليني أقارنها بماركة إنت تعرفها قدامك، وتشوف المواصفات بنفسك.`,src:`قارن موديلين`,to:`/compare`},{title:`حقك محفوظ`,say:`وعندك 14 يوم لو غيّرت رأيك والجهاز بحالته، و30 يوم لعيوب الصناعة بتقرير فني.`,src:`السياسات › الاستبدال والاسترجاع`,to:`/guide/policies`}]},{id:`display-unit`,g:`الثقة والضمان`,q:`مش عايز الجهاز المعروض`,also:[`المعروض`,`جهاز العرض`,`مخدوش`,`مفتوح`,`ديسبلاي`],replies:[{title:`جديد في كرتونته`,say:`أكيد، هيجيلك جديد في كرتونته الأصلية. ولو فيه أي ملحوظة على أي جهاز، هقولهالك قبل الدفع.`,src:`التوصيل للضيف › الشفافية`,to:`/guide/delivery`},{title:`لو المعروض فرصة`,say:`ولو حبيت المعروض، هوريك أي خدش بنفسك ونكتبه، والقرار ليك.`,src:`التوصيل للضيف › الشفافية`,to:`/guide/delivery`},{title:`افحصه وقت الاستلام`,say:`وقت الاستلام افحصه قدام مندوب التوصيل قبل ما توقع.`,src:`التوصيل للضيف`,to:`/guide/delivery`}]},{id:`delivery-slow`,g:`الخدمة والتوصيل`,q:`التوصيل هياخد وقت`,also:[`التوصيل`,`هيوصل امتى`,`متاخر`,`الشحن`,`امتى يوصل`],replies:[{title:`قوله الميعاد بوضوح`,say:`خليني أقولك ميعاد التوصيل المتوقع بالظبط حسب منطقتك، بدل ما أوعدك بحاجة مش أكيدة.`,src:`إجراءات البيع › الشحن`,to:`/guide/sales-procedures`},{title:`العنوان يفرق`,say:`عشان يوصل في ميعاده، هنكتب العنوان كامل بالعربي: الشارع والعمارة والدور والشقة وعلامة مميزة، ورقم واتساب.`,src:`التوصيل للضيف`,to:`/guide/delivery`},{title:`من فرع تاني أسرع`,say:`ولو متاح في فرع قريب، ممكن تستلمه من هناك أسرع.`,src:`Omni-Channel`,to:`/guide/policies`}]},{id:`installation`,g:`الخدمة والتوصيل`,q:`مين هيركب الجهاز؟`,also:[`التركيب`,`مين هيركب`,`هيركبوه`,`فني`],replies:[{title:`وضّح التفاصيل`,say:`خليني أوضحلك تفاصيل التركيب للجهاز ده بالظبط: مين بيركبه وإزاي تحجز الميعاد.`,src:`التوصيل للضيف`,to:`/guide/delivery`},{title:`اتأكد من المكان`,say:`وقبل التوصيل اتأكد من المقاس ومكان الجهاز، عشان التركيب يتم من أول مرة.`,src:`التوصيل للضيف`,to:`/guide/delivery`},{title:`رقم واتساب`,say:`وهناخد رقم واتساب صح، عشان فريق التوصيل يتواصل معاك مباشرة.`,src:`التوصيل للضيف`,to:`/guide/delivery`}]},{id:`manager`,g:`الخدمة والتوصيل`,q:`عايز أكلم المدير`,also:[`المدير`,`عايز المدير`,`مدير الفرع`,`مين المسؤول`],replies:[{title:`حقك`,say:`حقك طبعاً، وأنا هبلّغ مدير الفرع فوراً. بس خليني أسمع منك التفاصيل الأول عشان أوفّر وقتك.`,src:`الشكاوى › تصعيد الشكاوى`,to:`/guide/complaints`},{title:`مسار واضح`,say:`الشكوى ليها مسار رسمي، وأ
